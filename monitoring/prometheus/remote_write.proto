// Minimal Prometheus remote_write v1 wire schema — only the fields the workers actually send
// (a plain gauge sample per series, no exemplars/histograms/metadata). Field numbers match upstream
// prometheus/prometheus's prompb/{types,remote}.proto exactly, so the wire bytes are compatible; the
// gogoproto annotations there are Go-codegen-only and don't affect the wire format, so this file
// omits that dependency entirely.
syntax = "proto3";
package zeyo.prometheus.remote_write.v1;

message Label {
	string name = 1;
	string value = 2;
}

message Sample {
	double value = 1;
	int64 timestamp = 2; // ms since epoch
}

message TimeSeries {
	repeated Label labels = 1;
	repeated Sample samples = 2;
}

message WriteRequest {
	repeated TimeSeries timeseries = 1;
}
