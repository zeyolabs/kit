name: Publish

# Every merge to main publishes a new version to npmjs.com: no release step for anyone (human or
# agent) to run. Versions are vYYYY.M.N in London time: N counts that month's releases
# (2026.11.7, 2026.11.8, ...) and resets each month. package.json's version is set here only, never
# committed. npm trusted publishing: no token; npm trusts this repo + this workflow file.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.github/**', 'renovate.json', '.claude/**']
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # push the version tag
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Next version
        id: version
        run: |
          prefix="$(TZ=Europe/London date +%Y).$(TZ=Europe/London date +%-m)"
          last=$(git tag --list "v$prefix.*" | sed "s/^v$prefix\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          next="$prefix.$(( ${last:--1} + 1 ))"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Publishing $next"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest && npm publish
      - name: Tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
